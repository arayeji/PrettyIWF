# iwf.conf — example configuration (copy to /etc/iwf/iwf.conf and edit).
# Signaling-only IWF; GTP-U stays on RNC ↔ SGW-U (Direct Tunnel).

[iwf]
listen_ip   = 0.0.0.0
listen_port = 2123
# Required when listen_ip is 0.0.0.0: IPv4 advertised in F-TEID / GSN Address IEs.
local_ip    = 10.0.0.5
# Lab: build ULI from IMSI PLMN when Gn Create-PDP omits RAI (sgsnemu).
# synthetic_uli_no_rai = 1
# eutran (6) | utran (1) | geran (2) | wlan (3) — Open5GS SMF accepts 6/3.
rat_type    = eutran
# Gateway TAI/ECGI for EUTRAN ULI (Gn RAI is always LAC=0xfffe/RAC=0xff).
# Use an roaming TAC your partners accept; 0xc350 is the MME high-volume one.
# uli_tac = 0xc350
# uli_eci = 1
# PGW Create-Session selection. Tried in order until one yields an IPv4:
#   mip    — ULA MIP6-Agent-Info IPv4 (MIP-Home-Agent-Address), cached at UL
#   dns    — DNS-resolve ULA MIP-Home-Agent-Host FQDN, else mncNNN_pgw_fqdn,
#            else <apn>.apn.epc.mncXXX.mccYYY.3gppnetwork.org.
#            An APN-FQDN is resolved the way TS 23.003 §19.4.2.2 /
#            TS 29.303 §4.3.2 define it: NAPTR at that name, pick an RR
#            whose Service field has x-3gpp-pgw plus x-s8-gtp/x-s5-gtp,
#            follow it by (order, preference) and resolve the
#            replacement host to A. A plain A lookup on the APN-FQDN is
#            only the fallback, for host names (ULA MIP-Home-Agent-Host,
#            mncNNN_pgw_fqdn) and locally flattened zones.
#            No NAPTR and no A record → try the next source in the list;
#            if the list is exhausted, reject the Create-PDP locally. A
#            partner configured with dns alone therefore still rejects.
#   static — [roaming_hlr] mncNNN_pgw_ip (literal, no DNS)
#   smf    — [smf] ip (global fallback)
# Default: mip,dns,static,smf. Force a single source or reorder, e.g.:
#   pgw_select = static          # always use per-partner pgw_ip
#   pgw_select = dns,smf         # resolve first, fall back to [smf] ip
#   pgw_select = dns             # resolve only; a DNS miss rejects
#   pgw_select = mip,static,smf  # skip DNS
# pgw_select = mip,dns,static,smf
#
# Legacy: pgw_from_subscription=0 (without pgw_select) => static,dns,smf.
# pgw_from_subscription = 1
#
# Subscription PGW cache invalidation (seconds). Default 300 (5 minutes).
# Expired entries are dropped on lookup and by the periodic sweep. This also
# bounds how long the ULA-derived default APN is remembered, so it must cover
# the gap between Update Location and the first Create-PDP: raise it if you
# see "no ULA default APN cached" rejects for subscribers that did attach.
# pgw_cache_ttl_s = 300
#
# PGW NAPTR discovery. Positive results are cached for pgw_cache_ttl_s;
# these tune the negative cache and the per-query resolver budget. The
# budget matters because resolution is synchronous on the event loop, so a
# dead partner GpDNS must not be allowed to stall it.
# pgw_dns_neg_ttl_s  = 30
# pgw_dns_timeout_ms = 2000
#
# A Create-PDP whose APN IE arrives empty (the MS left the choice to the
# network and osmo-sgsn forwarded that verbatim) is filled in with the
# subscriber's default APN from the S6a/S6d Update-Location-Answer, i.e. the
# APN-Configuration whose Context-Identifier matches the profile default.
# There is no configuration key for this on purpose: the APN is subscription
# data and only the HSS is authoritative. Without a ULA for that IMSI the
# Create-PDP is rejected with cause 219 as before.
#
# Answer a Gn transaction still waiting on SGW-C after this many seconds
# with cause 204, instead of letting osmo-sgsn burn its whole N3 x T3
# (5 x 5 s) budget against a session that will never get a response.
# 0 disables. Default 15 (the sweep runs every 5 s, so it fires by 20 s).
# pending_timeout_s = 15

[sgsn]
ip          = 10.0.0.20
port        = 2123

[mme]
ip          = 10.0.0.42
port        = 2123

[sgwc]
ip          = 10.0.0.30
port        = 2123
# Optional per-IMSI-home-PLMN SGW-C (overrides default above):
# mnc002 = 10.0.0.30
# mnc003 = 10.0.0.31:2123

[smf]
# PGW-C / SMF GTP-C (S5/S8). teid must be 0 for initial Create Session.
# Used when pgw_select includes smf and earlier sources yield nothing.
# Optional if every subscriber's HSS returns a PGW (MIP6-Agent-Info) or each
# partner has mncNNN_pgw_ip / mncNNN_pgw_fqdn.
ip          = 10.0.0.9
teid        = 0

[logging]
level       = error
file        = -
# Optional startup trace prefixes (comma-separated). Runtime changes via metrics API:
#   curl 'http://127.0.0.1:9090/admin/trace/imsi?imsi=001010'
#   curl 'http://127.0.0.1:9090/admin/trace/imsi?imsi=001010000000001&match=exact'
#   curl 'http://127.0.0.1:9090/admin/trace/imsi?imsi=list'
#   curl 'http://127.0.0.1:9090/admin/trace/imsi?imsi=001010&remove=1'
#   curl 'http://127.0.0.1:9090/admin/trace/imsi?force=1'
# trace_imsi  = 001010

[metrics]
enabled     = 1
listen_ip   = 127.0.0.1
listen_port = 9090

# --- Optional: MAP ↔ Diameter (make MAP_IWF_ENABLED=1) -----------------------

[map_iwf]
enabled       = 0
# E.164 VLR Global Title (digits only). Used for MAP and, on GSUP CS ULR,
# encoded as Diameter SGSN-Number so Pretty5GS HSS stores vlr_number for Sh/T-ADS.
local_gt      = 1234567890
local_pc      = 1.2.3
local_ssn     = 149
# sccp_ri = gt | ssn
# gt  = Route on GT when GT present (default; osmo-stp GTT)
# ssn = Route on SSN; still include GT digits and SSN in the address
#      (partners that answer RI=SSN)
# Both modes: SCCP CdPA/CgPA have PCI=0 (no Point Code); M3UA DPC = [stp] remote_pc
# sccp_ri     = ssn
t_dialogue_ms = 10000
# isd_before_loc_up = 1   ; ISD then loc-up result (TS 29.002 default)
# isd_before_loc_up = 0   ; loc-up ReturnResult first, then ISD BEGIN
# cmd_sock    = /run/iwf/iwf_cmd.sock   ; optional; default /tmp/iwf_cmd.sock
#
# --- ProvideRoamingNumber / MSRN (optional; omit pools = feature off) --------
# IWF owns MSRN↔IMSI bindings. SIP (outside this repo) resolves inbound calls:
#   printf 'msrn_lookup <MSRN>\n' | socat - UNIX-CONNECT:/tmp/iwf_cmd.sock
#   printf 'msrn_show\n'          | socat - UNIX-CONNECT:/tmp/iwf_cmd.sock
# Reply: OK imsi=... msisdn=... pool=... msc=...  (or ERR not_found / expired)
# Binding is consumed on lookup when msrn_consume_on_lookup=1 (default).
# Empty pool / exhausted / unknown MSC → MAP error noRoamingNumberAvailable.
# msrn_pool = 990000000000-990000009999:msc1
# msrn_pool = 990000010000-990000019999:msc2
# msrn_msc_map = 990000000001:msc1
# msrn_msc_map = 990000000002:msc2
# msrn_ttl_sec = 30
# msrn_consume_on_lookup = 1

[stp]
local_ip          = 10.0.0.5
ip                = 10.0.0.21
port              = 2905
remote_pc         = 1.2.3
routing_context   = 1
network_indicator = reserved

[diameter_s6d]
# Single peer (legacy) or comma-separated list for DRA load share:
# peers = 10.0.0.50:3868,10.0.0.51:3868
peer_ip       = 10.0.0.50
peer_port     = 3868
origin_host   = iwf.epc.mnc001.mcc001.3gppnetwork.org
# Required for CS: separate Diameter identity (stored as HSS vlr_host) vs PS MME.
# Must match the Origin-Host HSS expects for CS IDR/CLR/PUR toward IWF.
# origin_host_cs = iwf-vlr.epc.mnc001.mcc001.3gppnetwork.org
origin_realm  = mnc001.mcc001.3gppnetwork.org
dest_host     = hss.epc.mnc001.mcc001.3gppnetwork.org
dest_realm    = mnc001.mcc001.3gppnetwork.org
product_name  = iwf
vendor_id     = 10415
watchdog_ms   = 30000
request_timeout_ms = 10000

# --- Optional: GSUP proxy (osmo-sgsn / osmo-msc → Open5GS HSS) ---------------

[gsup_server]
enabled     = 0
listen_ips  = 10.0.0.5
listen_port = 4222
# Visited PLMN for GTPv2 Serving Network (must be this network, not the
# subscriber's home PLMN — required for Open5GS inbound-roam NWI selection).
local_mcc   = 432
local_mnc   = 012
# Local (home) IMSI prefixes: bare APN-NI on Create Session.
# Everyone else is treated as inbound roamer → APN FQDN
#   <ni>.mncXXX.mccYYY.gprs  (SGW-C/VPP NWI expects the FQDN).
# Omit → fall back to matching local_mcc+local_mnc only.
# home_imsi_prefix = 00101,00102
# MAP dialogue / pending timeout. International SS7 partners can answer
# 10-30s late under load; too-short a value discards late answers and
# fuels UE retry storms.
timeout_ms  = 30000
# Combine mode (CSFB): CS/VLR GSUP from osmo-msc → MAP-C; PS from osmo-sgsn → S6d.
# Requires [roaming_hlr] mncNNN_hlr_gt (and for home, mncNNN_hlr_gt for local_mnc).
# cs_backend = map
# ps_backend = diameter

[roaming_hlr]
# Home PLMN uses [diameter_s6d] dest_realm (GSUP_ROUTE_LOCAL) for PS when
# ps_backend=diameter. For CS when cs_backend=map, also set home HLR GT:
# mnc001_hlr_gt     = 1234567890123
# Roaming partner via DRA (S6d) — set dest_realm to partner HSS realm:
# mnc003_diameter   = 1
# mnc003_dest_realm = mnc003.mcc001.3gppnetwork.org
# mnc003_dest_host  = hss.partner.example   # optional; omit for realm routing
#
# Preconfigured PGW for this partner — used when pgw_select includes
# static (pgw_ip) and/or dns (pgw_fqdn). Override the global order per
# partner with mncNNN_pgw_select (same tokens: mip,dns,static,smf).
# mnc003_pgw_ip     = 10.50.0.9
# mnc003_pgw_fqdn   = pgw.mnc003.mcc001.3gppnetwork.org
# mnc003_pgw_select = static,smf
#
# Optional APN allow-list for this PLMN (APN-NI, comma-separated).
# Omit or leave empty → allow all APNs. If set → only listed APNs.
# mnc002_apn = partnernet,internet,ims
# mnc003_apn = partnernet,internet
#
# E.214 MGT routing (per partner): route the first UL/SAI/UGL on a Mobile
# Global Title derived from the IMSI instead of a fixed E.164 hlr_gt.
# CdPA GT = e214_prefix + MSIN (IMSI without MCC+MNC), NP=E.214, TT=0.
# Use when the partner STP returns UDTS "no translation for this specific
# address" for the configured hlr_gt (their GTT is IMSI/E.214-based).
# mnc003_e214_prefix = 99001
#
# Roaming partner via MAP/SS7 (legacy):
# mnc999_hlr_gt  = 1234567890123
# mnc999_ssn     = 6
# mnc999_src_ip  = 10.0.0.5
# mnc999_src_gt  = 1234567890

# --- Optional: MAP SMS (make SMS_IWF_ENABLED=1) ------------------------------

[sms_iwf]
enabled           = 0
hlr_ssn           = 6
local_msc_gt      = 1234567890000
local_smsc_gt     = 1234567890006
gsup_timeout_ms   = 3000
sri_sm_timeout_ms = 5000
fwdsm_timeout_ms  = 30000

[gsup_client]
remote_ip         = 127.0.0.1
remote_port       = 4222
client_name       = IWF-SMS

[smpp_server]
bind_ip           = 127.0.0.1
port              = 2777
system_id         = iwf
password          = changeme

[partner.example]
hlr_gt            = FILL_IN_PARTNER_HLR_GT
msisdn_prefixes   = 12345,12346
